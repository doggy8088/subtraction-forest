  <body>
    <!--app:start-->
    <div id="root">
      <main class="seo-fallback">
        <h1>暖暖森林：國小三年級 3D 三位數減法教學遊戲</h1>
        <p>
          和小狐狸一起，用積木解開三位數減法。動動手、想一想，把小小的幫助送給森林朋友。
        </p>
        <p>
          用一大片表示 100、一條表示 10、一小塊表示 1。遇到不夠減的時候，將 1
          個百換成 10 個十，或將 1 個十換成 10 個一。
        </p>
        <ul>
          <li>暖陽小徑：不退位減法。</li>
          <li>蘑菇森林：一次退位。</li>
          <li>星光溪谷：連續退位。</li>
          <li>雲朵樹屋：跨零退位。</li>
        </ul>
        <p>
          每站有三個小任務，提供具體提示、反向加法檢查和朋友的感謝。沒有計時或扣分，不必登入；紀念冊只儲存在自己的瀏覽器。
        </p>
      </main>
    </div>
    <!--app:end-->
