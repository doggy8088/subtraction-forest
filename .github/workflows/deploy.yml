name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.pages-artifact.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun test
      - run: bun run build
      - run: bun run check:site
      - uses: actions/upload-pages-artifact@v5
        id: pages-artifact
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/github-script@v9
        env:
          PAGES_ARTIFACT_ID: ${{ needs.verify.outputs.artifact_id }}
        with:
          script: |
            const { deployPages } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/deploy-pages.mjs`);
            await deployPages({ github, core, context, artifactId: Number(process.env.PAGES_ARTIFACT_ID) });
